name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to promote @next → @latest"
        required: true
        type: choice
        options:
          - fnclaude
          - "@fnclaude/cli"
          - "@fnclaude/renderer"
      version:
        description: "Version to promote (must already be published under @next)"
        required: true
        type: string

# On PRs and merge queue: cancel stale runs when new commits arrive.
# On push to main: never cancel — a publish mid-flight must complete.
# On workflow_dispatch: never cancel — a promotion mid-flight must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:

  # ── Verify ────────────────────────────────────────────────────────────────
  # Runs on all events except workflow_dispatch (which is promote-only).
  # Make this job a required status check on main in branch protection settings.
  #
  # Toolchain: Bun (runtime + package manager + test runner) and moon (task
  # orchestration across the monorepo). Both are pinned in mise.toml — the
  # mise-action step installs whatever mise.toml asks for, keeping a single
  # source of truth between local dev and CI.
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 intermittently fails with
      # `fatal: could not read Username for 'https://github.com'`. Three-attempt
      # retry absorbs the flake without needing a manual rerun; final attempt
      # has no `continue-on-error` so a real failure still fails the job.
      - uses: actions/checkout@v4
        id: checkout-1
        continue-on-error: true
        with:
          # moon resolves a touched-files baseline against the default branch
          # for incremental task scheduling. Without fetching it, moon errors
          # with `fatal: ambiguous argument 'main': unknown revision`.
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure'
        id: checkout-2
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure'
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          # mise.toml at the repo root drives the tool list.
          experimental: true
      - run: bun install --frozen-lockfile
      - run: moon run :lint
      - run: moon run :test
      - run: moon run :build

  # ── Publish @next ─────────────────────────────────────────────────────────
  # Runs on every push to main. release-please-action either opens/updates a
  # per-package release PR or, when one of those release PRs is merged, tags
  # the release and surfaces it via `paths_released`. For every released path
  # we publish that package to npm under the @next dist-tag.
  #
  # Trusted-publisher OIDC is configured on npmjs.com for all three packages
  # (provider=GitHub Actions, repo=fnclaude/fnclaude, workflow=ci.yml). No
  # NPM_TOKEN secret — `id-token: write` + npm CLI's built-in OIDC handshake
  # do the auth. That's why this workflow file must stay named `ci.yml`.
  publish-next:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release-please creates tags + GitHub releases
      pull-requests: write  # release-please opens/updates release PRs
      id-token: write       # OIDC — npm trusted-publisher auth + provenance
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PAT (not GITHUB_TOKEN) so release-please's PRs fire downstream
          # workflow events (auto-merge.yml, future CI). PRs opened by
          # GITHUB_TOKEN are intentionally suppressed from triggering
          # workflows — that suppression would leave release PRs sitting
          # open forever waiting for a `verify` run that never starts.
          token: ${{ secrets.AUTOMERGE_PAT }}

      # actions/checkout@v4 intermittently fails with
      # `fatal: could not read Username for 'https://github.com'`. Three-attempt
      # retry absorbs the flake without needing a manual rerun; final attempt
      # has no `continue-on-error` so a real failure still fails the job.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        id: checkout-1
        continue-on-error: true
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.checkout-1.outcome == 'failure' }}
        id: checkout-2
        continue-on-error: true
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - uses: jdx/mise-action@v2
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          experimental: true

      # Resolve Bun's `workspace:*` protocol to concrete sibling versions
      # *before* publishing. Why this dance exists at all:
      #
      #   - npm publish does NOT rewrite the `workspace:` protocol — the
      #     literal string "workspace:*" would end up in the published
      #     tarball and break every consumer doing `npm install fnclaude`.
      #   - bun publish DOES rewrite it, but doesn't yet support
      #     --provenance or npm trusted-publisher OIDC auth
      #     (oven-sh/bun#15601). Switching to bun publish would mean
      #     dropping provenance and reverting to a long-lived NPM_TOKEN.
      #   - release-please's node-workspace plugin updates `^range`-style
      #     workspace cross-deps fine, but explicitly leaves
      #     protocol-prefixed deps (workspace:, file:, link: …) untouched.
      #
      # So we do the rewrite ourselves, in place, before `npm publish`.
      # First, build a { name → version } map from every workspace
      # package.json (release-please has bumped them by the time this
      # step runs — the release PR's merge commit *is* the bump).
      - name: Build sibling version map
        id: siblings
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          set -euo pipefail
          map=$(jq -s 'map({(.name): .version}) | add' \
            packages/cli/package.json \
            packages/fnclaude/package.json \
            packages/renderer/package.json)
          echo "Resolved siblings:"
          echo "$map" | jq .
          # Multiline GITHUB_OUTPUT via heredoc delimiter.
          {
            echo "map<<EOF"
            echo "$map"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Topo-sort `paths_released` so dependents are published *after* their
      # dependencies. In this repo, `fnclaude` depends on `@fnclaude/cli` and
      # `@fnclaude/renderer`; `cli` and `renderer` have no inter-dependencies.
      # When release-please emits a multi-package release, the order is
      # whatever jq happens to produce — sometimes `fnclaude` first, which
      # briefly publishes a package referencing sibling versions that don't
      # yet exist on npm. Sorting `packages/fnclaude` to the end fixes that.
      #
      # The dep graph is small enough that an explicit "fnclaude last" key
      # function is sufficient; don't over-generalize for hypothetical future
      # packages — extend this when a new dependent actually appears.
      - name: Topo-sort paths_released (dependents last)
        id: sorted
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          set -euo pipefail
          sorted=$(echo "$PATHS_RELEASED" | jq -c '
            sort_by(if . == "packages/fnclaude" then 1 else 0 end)
          ')
          echo "Original order: $PATHS_RELEASED"
          echo "Sorted order:   $sorted"
          echo "sorted=${sorted}" >> "$GITHUB_OUTPUT"

      # Translation follows Bun's documented rules:
      #   workspace:*       → ^<version>
      #   workspace:^       → ^<version>
      #   workspace:~       → ~<version>
      #   workspace:<x.y.z> → <x.y.z>   (explicit override)
      - name: Resolve workspace:* deps to concrete versions
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          SORTED: ${{ steps.sorted.outputs.sorted }}
          SIBLINGS: ${{ steps.siblings.outputs.map }}
        run: |
          set -euo pipefail
          echo "$SORTED" | jq -r '.[]' | while read -r pkg_path; do
            pkg_json="$pkg_path/package.json"
            echo "::group::Rewriting workspace:* deps in $pkg_json"
            tmp=$(mktemp)
            jq --argjson siblings "$SIBLINGS" '
              def rewrite_deps:
                with_entries(
                  if (.value | type == "string" and startswith("workspace:")) then
                    .value as $spec
                    | .key as $dep
                    | ($siblings[$dep]
                        // error("no sibling version for workspace dep " + $dep)) as $sv
                    | if   $spec == "workspace:*" then .value = "^" + $sv
                      elif $spec == "workspace:^" then .value = "^" + $sv
                      elif $spec == "workspace:~" then .value = "~" + $sv
                      else .value = ($spec | sub("^workspace:"; ""))
                      end
                  else . end
                );
              (if has("dependencies")         then .dependencies         |= rewrite_deps else . end)
              | (if has("devDependencies")      then .devDependencies      |= rewrite_deps else . end)
              | (if has("peerDependencies")     then .peerDependencies     |= rewrite_deps else . end)
              | (if has("optionalDependencies") then .optionalDependencies |= rewrite_deps else . end)
            ' "$pkg_json" > "$tmp"
            mv "$tmp" "$pkg_json"
            jq '{name, version, dependencies, devDependencies, peerDependencies, optionalDependencies} | with_entries(select(.value != null))' "$pkg_json"
            echo "::endgroup::"
          done

      # Refresh bun.lock against the freshly-bumped package.jsons so that
      # bun.lock's workspaces section reflects the new version numbers.
      # release-please bumps package.json but does not update bun.lock; this
      # means `bun pm pack` and other bun tools that read workspace versions
      # from bun.lock (oven-sh/bun#20477) would see stale versions on the next
      # checkout. Running `bun install` here re-syncs the lockfile in the
      # runner's working tree. We don't commit it back to main (that would
      # re-trigger publish-next and requires an extra push round-trip); CI
      # always runs `bun install` before bun operations, so the runner is
      # always in a consistent state even without the committed update.
      - name: Refresh bun.lock workspace versions
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: bun install

      # Invariant: after the workspace:* rewrite, every sibling dep in every
      # to-be-published package.json must resolve to a version that is either
      #   (a) about to be published earlier in this same (topo-sorted) run, or
      #   (b) already published on npm.
      #
      # This catches the historical failure where `fnclaude@npm` shipped with
      # `@fnclaude/cli@^X.Y.Z` pointing at a `cli` version that was never
      # published — e.g. because `cli`'s in-tree package.json drifted ahead
      # of its last @next release. Refuses to publish anything if the chain
      # would be broken, rather than shipping the broken artifact and needing
      # an emergency republish.
      - name: Verify rewritten workspace deps resolve
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          SORTED: ${{ steps.sorted.outputs.sorted }}
        run: |
          set -euo pipefail
          # Names of every package about to be published in this run.
          about_to_publish=$(echo "$SORTED" | jq -r '.[]' \
            | while read -r p; do jq -r '.name' "$p/package.json"; done \
            | sort -u)
          echo "About to publish: $(echo $about_to_publish | tr '\n' ' ')"

          fail=0
          for pkg_path in $(echo "$SORTED" | jq -r '.[]'); do
            pkg_json="$pkg_path/package.json"
            pkg_name=$(jq -r '.name' "$pkg_json")
            echo "::group::Verifying deps for $pkg_name ($pkg_path)"
            # Process substitution (`done < <(...)`) keeps the while loop in
            # the current shell so `fail=1` and the post-loop checks survive.
            while read -r dep_name dep_range; do
              # If the value still starts with `workspace:`, the rewrite step
              # missed it — treat as a hard failure.
              if [[ "$dep_range" == workspace:* ]]; then
                echo "::error::$pkg_name still has unrewritten $dep_name=$dep_range after rewrite step"
                fail=1
                continue
              fi
              # Extract X.Y.Z from ^X.Y.Z / ~X.Y.Z / X.Y.Z.
              version=$(echo "$dep_range" | sed -E 's/^[\^~]?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
              if echo "$about_to_publish" | grep -qx "$dep_name"; then
                echo "  ok: $pkg_name -> $dep_name@$version (publishing earlier this run)"
                continue
              fi
              if npm view "$dep_name@$version" version >/dev/null 2>&1; then
                echo "  ok: $pkg_name -> $dep_name@$version (already on npm)"
              else
                echo "::error::$pkg_name depends on $dep_name@$version, which is neither in this release nor on npm. Refusing to publish."
                fail=1
              fi
            done < <(jq -r '
              [.dependencies // {}, .devDependencies // {}, .peerDependencies // {}, .optionalDependencies // {}]
              | map(to_entries) | add
              | .[]
              | select(.key | IN("@fnclaude/cli","@fnclaude/renderer","fnclaude"))
              | "\(.key) \(.value)"
            ' "$pkg_json")
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more workspace deps would not resolve. Refusing to publish."
            exit 1
          fi

      # `sorted` is a JSON string of an array, e.g. '["packages/cli","packages/fnclaude"]',
      # in topo order (dependents last). Iterate and publish each one to @next.
      # --provenance attaches an OIDC-signed provenance attestation; the same
      # OIDC token authenticates the publish itself via the package's
      # trusted-publisher config.
      - name: Publish released packages to @next
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          SORTED: ${{ steps.sorted.outputs.sorted }}
        run: |
          set -euo pipefail
          echo "$SORTED" | jq -r '.[]' | while read -r pkg_path; do
            echo "::group::Publishing $pkg_path to @next"
            (cd "$pkg_path" && npm publish --provenance --tag next)
            echo "::endgroup::"
          done

  # ── Promote @next → @latest ───────────────────────────────────────────────
  # Triggered manually via "Run workflow" in the GitHub Actions UI. Choose
  # the package and the @next version to promote. Moves the npm dist-tag
  # from @next to @latest (no rebuild — same artifact) and flips the
  # corresponding GitHub pre-release into the latest release.
  #
  # Setup: create a "production" environment in repo Settings → Environments
  # and configure required reviewers for an approval gate before promotion.
  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # gh release edit
      id-token: write   # OIDC — npm trusted-publisher auth for dist-tag
    steps:
      # actions/checkout@v4 intermittently fails with
      # `fatal: could not read Username for 'https://github.com'`. Three-attempt
      # retry absorbs the flake without needing a manual rerun; final attempt
      # has no `continue-on-error` so a real failure still fails the job.
      - uses: actions/checkout@v4
        id: checkout-1
        continue-on-error: true
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure'
        id: checkout-2
        continue-on-error: true
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure'
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # Map the user-facing package name to its release-please tag component.
      # Tag format is `<component>-v<version>` because the manifest config
      # sets include-component-in-tag: true. The node strategy normalizes a
      # scoped package name `@scope/name` down to `name`, so:
      #   fnclaude            → fnclaude-vX.Y.Z
      #   @fnclaude/cli       → cli-vX.Y.Z
      #   @fnclaude/renderer  → renderer-vX.Y.Z
      - name: Resolve GitHub release tag for package
        id: resolve
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            "fnclaude")            component="fnclaude" ;;
            "@fnclaude/cli")       component="cli" ;;
            "@fnclaude/renderer")  component="renderer" ;;
            *) echo "::error::Unknown package: $PACKAGE"; exit 1 ;;
          esac
          tag="${component}-v${VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${PACKAGE}@${VERSION} (tag ${tag})"

      # Confirm the version we're about to promote actually exists on @next.
      # Catches typos in the workflow_dispatch input before we mutate state.
      - name: Verify version is on @next
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NEXT=$(npm view "$PACKAGE" dist-tags.next 2>/dev/null || true)
          if [ -z "$NEXT" ]; then
            echo "::error::$PACKAGE has no @next dist-tag — nothing to promote."
            exit 1
          fi
          # Allow promoting any historical @next version (not just the current
          # one), as long as the version exists on the registry.
          if ! npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE@$VERSION is not published on npm."
            exit 1
          fi
          echo "Current @next for $PACKAGE is $NEXT; promoting $VERSION."

      - name: Promote @next → @latest on npm
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: npm dist-tag add "${PACKAGE}@${VERSION}" latest

      - name: Promote GitHub pre-release → latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release edit "$TAG" --prerelease=false --latest
