name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# On PRs and merge queue: cancel stale runs when new commits arrive.
# On push to main: never cancel. Publishing moved to release.yml, but a
# cancelled main run still costs the next PR its incremental baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

# Publishing lives in release.yml, not here: npm's trusted publisher is
# registered against that filename, so `npm publish` has to run from a workflow
# called `release.yml` for the OIDC handshake to authenticate. This workflow is
# the `verify` gate and nothing else.

jobs:

  # ── Verify ────────────────────────────────────────────────────────────────
  # Make this job a required status check on main in branch protection settings.
  #
  # Toolchain: Bun (runtime + package manager + test runner) and moon (task
  # orchestration across the monorepo). Both are pinned in mise.toml — the
  # mise-action step installs whatever mise.toml asks for, keeping a single
  # source of truth between local dev and CI.
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 intermittently fails with
      # `fatal: could not read Username for 'https://github.com'`. Three-attempt
      # retry absorbs the flake without needing a manual rerun; final attempt
      # has no `continue-on-error` so a real failure still fails the job.
      - uses: actions/checkout@v4
        id: checkout-1
        continue-on-error: true
        with:
          # moon resolves a touched-files baseline against the default branch
          # for incremental task scheduling. Without fetching it, moon errors
          # with `fatal: ambiguous argument 'main': unknown revision`.
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure'
        id: checkout-2
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure'
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          # mise.toml at the repo root drives the tool list.
          experimental: true
      - run: bun install --frozen-lockfile
      # The ttsc/Go transform host is compiled once (41–72 s) into this repo-local cache
      # (tools/ttsc-build.ts roots every Go/ttsc cache here). Persisting it keyed on the
      # ttsc/typescript pins and the vendored transform source pays that compile once per
      # key instead of on every run. Object caches are content-keyed, so a stale restore
      # is safe — a key miss just recompiles.
      - uses: actions/cache@v4
        with:
          path: packages/cli/.cache/ttsc
          key: ttsc-host-${{ runner.os }}-${{ hashFiles('packages/cli/package.json', 'packages/cli/vendor/transforms/**') }}
          restore-keys: |
            ttsc-host-${{ runner.os }}-
      - run: moon run :lint
      # Build BEFORE test: the e2e/unit tiers spawn bin/fnc.js, whose dev path would
      # otherwise rebuild dist inside every spawned process concurrently and time out.
      # (packages/cli's `test` task also declares `~:build` as a dep, so this ordering is
      # belt-and-suspenders.)
      - run: moon run :build
      - run: moon run :test
      # The composition tier is authored in the registration dialect, so it runs
      # through its own ttsc lowering lane rather than the plain `bun test` unit tier.
      - name: composition tier
        run: bun run test:composition
        working-directory: packages/cli
