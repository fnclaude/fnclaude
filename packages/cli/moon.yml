# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'

tasks:
  lint:
    command: 'bun run lint'
    options:
      cache: false
  test:
    command: 'bun run test'
    # The tiers spawn bin/fnc.js, whose dev path rebuilds dist/ on a cold checkout. Building
    # first (rather than letting each spawned shim build concurrently and time out) is the
    # durable fix — `moon run :test` anywhere lowers dist once before the tests run.
    deps:
      - '~:build'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  build:
    # Lowers src/** through the ttsc/Go engine into dist/ (tools/build-dist.ts):
    # the STAGE spawns the transform host from the *.extras devDeps, the BUNDLE
    # folds the staged emit with @rhombus-std/* external, and the dist/.lowered
    # sentinel is written last (the marker bin/fnc.js forks on).
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'tools/**/*'
      - 'vendor/**/*'
      - 'tsconfig.json'
      - 'tsconfig.ttsc.json'
      - 'tsconfig.build.json'
      - 'package.json'
    outputs:
      - 'dist'
