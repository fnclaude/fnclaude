# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'

tasks:
  lint:
    command: 'bun run lint'
    options:
      cache: false
  test:
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  build:
    # Lowers src/** through the ttsc/Go engine into dist/ (tools/build-dist.ts):
    # the STAGE spawns the transform host from the *.extras devDeps, the BUNDLE
    # folds the staged emit with @rhombus-std/* external, and the dist/.lowered
    # sentinel is written last (the marker bin/fnc.js forks on).
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'tools/**/*'
      - 'vendor/**/*'
      - 'tsconfig.json'
      - 'tsconfig.ttsc.json'
      - 'tsconfig.build.json'
      - 'package.json'
    outputs:
      - 'dist'
